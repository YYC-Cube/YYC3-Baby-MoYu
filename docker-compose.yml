# YYC³ 小语 · 单实例部署（SQLite + 进程内限流）
# 说明：当前架构为单副本语义（见 docs/developer/08-deployment.md「部署拓扑约束」）。
# 多副本前必须替换限流实现（Redis）并迁移 SQLite → PostgreSQL。
#
# 使用：
#   cp .env.example .env.local   # 填入 JWT_SECRET / AI 密钥
#   docker compose up -d --build
#   curl -fsS localhost:1228/api/health

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yyc3-baby-moyu:local
    container_name: yyc3-baby-moyu
    restart: unless-stopped
    ports:
      - "1228:1228"
    environment:
      NODE_ENV: production
      # 缺失即启动后被鉴权拒绝：必须在 .env.local 或宿主机环境中提供
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # AI 密钥均可留空：缺省时对话降级为示例、生图降级为占位图（见 06-ai-engine.md）
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      FAL_KEY: ${FAL_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 驱动：默认 sqlite（落盘 ./data）；切 PG 时在 .env 设置
      #   DB_DRIVER=postgres
      #   DATABASE_URL=postgres://app:***@postgres:5432/yyc3
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-/app/data/yyc3.db}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      SEED_DEMO: ${SEED_DEMO:-false}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_DIR: /app/logs
    volumes:
      # 数据库与日志必须在宿主持久化，容器重建不丢数据
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1228/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # 可选：PG15（仅在 .env 设置 DB_DRIVER=postgres 且启用 profile 时启动）
  #   docker compose --profile pg up -d --build
  # 若使用外部/云上 PG，则本服务不需要启用。
  postgres:
    image: postgres:15-alpine
    profiles: ["pg"]
    container_name: yyc3-baby-moyu-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-app}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 未设置}
      POSTGRES_DB: ${PG_DATABASE:-yyc3}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # 不对外暴露端口：仅容器网络内可达（应用经 postgres:5432 访问）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-app} -d ${PG_DATABASE:-yyc3}"]
      interval: 10s
      timeout: 5s
      retries: 5
