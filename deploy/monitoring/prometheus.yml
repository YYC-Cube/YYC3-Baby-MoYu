# YYC³ Baby-MoYu · Prometheus 抓取配置
#
# 前置：/api/metrics 已启用应用层令牌（生产未配置 METRICS_TOKEN 时返回 503）
#   1) 生成令牌：bun run gen:metrics-token -- production --print
#   2) 写入令牌文件（该路径已 .gitignore，禁止提交）：
#        umask 077 && printf '%s' "<token>" > deploy/monitoring/metrics_token
#        chmod 600 deploy/monitoring/metrics_token
#   3) 启动（--user 使 0600 令牌可读；数据用宿主目录挂载——命名卷在 --user 下不可写）：
#        mkdir -p deploy/monitoring/data
#        docker run -d --name yyc3-prometheus \
#          --user "$(id -u):$(id -g)" \
#          -p 127.0.0.1:9090:9090 \
#          -v "$PWD/deploy/monitoring:/etc/prometheus:ro" \
#          -v "$PWD/deploy/monitoring/data:/prometheus" \
#          prom/prometheus:v3.1.0 \
#          --config.file=/etc/prometheus/prometheus.yml \
#          --storage.tsdb.path=/prometheus \
#          --storage.tsdb.retention.time=15d
#
# 完整 Runbook（含 promtool 校验、负向验证、排障表）见 docs/YYC3-运维Runbook-Prometheus部署与密钥轮换.md
# 目标地址：容器内访问宿主机用 host.docker.internal；同机裸装改 127.0.0.1:1228

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: yyc3-baby-moyu

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: yyc3-baby-moyu
    metrics_path: /api/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets:
          - host.docker.internal:1228
        labels:
          service: yyc3-baby-moyu
          env: production
