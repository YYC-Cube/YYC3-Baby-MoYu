name: YYC3-XY Workspace CI

# 触发范围：仅工作区（docs/YYC3-小语/YYC3-XY-WORKSPACE）或其门禁脚本变更
on:
  push:
    paths:
      - 'docs/YYC3-小语/YYC3-XY-WORKSPACE/**'
      - '.github/workflows/yyc3-xy-workspace-ci.yml'
  pull_request:
    paths:
      - 'docs/YYC3-小语/YYC3-XY-WORKSPACE/**'
      - '.github/workflows/yyc3-xy-workspace-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yyc3-xy-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKDIR: 'docs/YYC3-小语/YYC3-XY-WORKSPACE'

jobs:
  gates:
    name: 四绿门禁 + 覆盖率阈值
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'docs/YYC3-小语/YYC3-XY-WORKSPACE'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun（与 bun.lock 对齐）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 安装 pnpm（与 packageManager 对齐）
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（锁定）
        run: bun install --frozen-lockfile

      - name: ① 类型检查
        run: pnpm typecheck

      - name: ② 测试 + 覆盖率阈值（vitest --coverage）
        run: pnpm test:coverage

      - name: ③ 引用契约自检（断链 / 越包相对 / 未声明依赖）
        run: pnpm verify

      - name: ④ 生产构建
        run: pnpm build

      - name: 门禁结果汇总
        if: always()
        run: |
          {
            echo "### YYC³-XY 工作区门禁"
            echo ""
            echo "| 门禁 | 命令 |"
            echo "| ---- | ---- |"
            echo "| 类型检查 | \`pnpm typecheck\` |"
            echo "| 测试 + 覆盖率 | \`pnpm test:coverage\` |"
            echo "| 引用自检 | \`pnpm verify\` |"
            echo "| 构建 | \`pnpm build\` |"
            echo ""
            echo "结果：${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yyc3-xy-workbench-dist
          path: 'docs/YYC3-小语/YYC3-XY-WORKSPACE/apps/workbench/dist'
          retention-days: 7

  visual:
    name: 视觉回归 + 行为 E2E（Linux 基线，强门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 使用 Playwright 官方镜像：内置 chromium-1148（与 @playwright/test 1.49.1 对齐）
    # Linux 基线已随仓库提交于 apps/workbench/e2e/screenshots/linux
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
      options: --ipc=host
    defaults:
      run:
        working-directory: 'docs/YYC3-小语/YYC3-XY-WORKSPACE'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 bun / pnpm（镜像内无预装）
        run: npm i -g bun@1.3.11 pnpm@9.15.4

      - name: 安装依赖（锁定，与 bun.lock 对齐）
        run: bun install --frozen-lockfile

      - name: 主题视觉回归（8 张 Linux 基线）
        run: pnpm test:visual

      - name: 应用行为回归（导航 / 收藏持久化 / 表单提交 / 主题）
        run: pnpm test:e2e

      - name: 关键路由可访问性（axe：结构阻断 + 对比度棘轮）
        run: pnpm test:a11y

      - name: 上传差异产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yyc3-xy-visual-diff
          path: 'docs/YYC3-小语/YYC3-XY-WORKSPACE/test-results'
          retention-days: 7
