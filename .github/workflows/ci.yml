name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 统一 CI 运行标记（Playwright/Next 均据此进入 CI 模式）
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (node:sqlite 需要 ≥ 22.5)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Test (node:sqlite 直测)
        run: bun run test:node

      # P4(i18n) 收口：镜像路由缺失/词条键不一致时阻断（脚本 exit 1）
      - name: i18n boundary (strict)
        run: bun run check:i18n:strict

      - name: Build
        run: bun run build

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: e2e（生产构建 + 账号自举，无需种子数据；视觉基线单独 job）
        env:
          # next start 为 production 模式：必须显式提供 JWT_SECRET；种子演示账号被生产守卫跳过，
          # e2e 第 0 步经 register 自举账号
          JWT_SECRET: ci-test-secret-not-for-production
        run: bun run test:e2e -- --grep-invert "视觉基线"

  visual:
    name: 四主题视觉回归（Linux 基线）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host
    env:
      JWT_SECRET: ci-test-secret-not-for-production
      BIGMODEL_API_KEY: ci-test-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip（Playwright 容器缺少 setup-bun 解压依赖）
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: 视觉回归（四主题 × 首页/视频工坊）
        run: bun run test:visual
