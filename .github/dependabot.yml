# Dependabot 配置 · YYC³ 家族
# 说明：本项目由 Bun 管理（根目录存在 bun.lock），必须使用 package-ecosystem: bun；
# 使用 npm_and_yarn 会因无法解析 bun.lock 而持续失败（既有远程 CI 红叉根因）。
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      runtime-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      tooling-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # 主版本升级需人工评估：TypeScript 7 目前与 typescript-eslint 8 不兼容，
    # 自动 PR 会在 CI 34s 内失败（历史 run 41407953310），因此屏蔽 major 自动升级。
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
