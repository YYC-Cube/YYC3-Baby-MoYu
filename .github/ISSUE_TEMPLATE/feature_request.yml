name: 功能建议
description: 提出新功能或体验改进建议
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相似建议，并说明目标用户与价值。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点、影响人群、发生频率
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互/流程；可附草图或参考
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 已考虑过的替代方案与取舍
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 首页 / 导航
        - 成长记录 / 成长树
        - 徽章 / 作业 / 课程
        - AI 对话 / 语音
        - 设置 / 国际化
        - 数据层 / API
        - 可访问性 / 主题
        - 文档 / 构建 / CI
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 该建议不涉及未修复的安全漏洞披露
          required: true
