name: Bug 报告
description: 报告可复现的缺陷（请勿在此披露安全漏洞）
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索是否已有相同 Issue。
        ⚠️ 安全漏洞请按 SECURITY.md 私密报告，不要在此公开细节。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 一句话说明现象与影响
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小化、可重复的步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 含报错信息、截图或日志（请脱敏）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 例如 v1.0.0 或 git commit hash
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: OS / Node / Bun / 浏览器版本
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 首页 / 导航
        - 成长记录 / 成长树
        - 徽章 / 作业 / 课程
        - AI 对话 / 语音
        - 设置 / 国际化
        - 数据层 / API
        - 可访问性 / 主题
        - 文档 / 构建 / CI
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 我未在此披露安全漏洞细节
          required: true
